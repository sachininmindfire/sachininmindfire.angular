<!-- utility.component.html -->
<div class="utility-container">
  <h1>Application Utilities</h1>
  <p class="utility-description">Discover helpful tools and utilities to enhance your workflow</p>
  
  <div class="utility-cards">
    <a [routerLink]="['/recipe-maker']" class="utility-card-link">
      <div class="utility-card">
        <div class="utility-icon">🍳</div>
        <h3>Recipe Maker</h3>
        <p>AI-powered recipe suggestions based on ingredients you have</p>
        <span class="utility-badge">New</span>
      </div>
    </a>

    <a [routerLink]="['/rock-paper-scissors']" class="utility-card-link">
      <div class="utility-card">
        <div class="utility-icon">✌️</div>
        <h3>AI Rock Paper Scissors</h3>
        <p>Interactive webcam game with real-time hand gesture recognition AI</p>
        <span class="utility-badge">New</span>
      </div>
    </a>
    
    <!-- Add more utility cards here as new utilities are developed -->
  </div>
</div>
